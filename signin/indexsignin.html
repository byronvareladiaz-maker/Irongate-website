<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | Iron Gate Industries</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- Top Navigation Bar --- */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      font-size: 14px;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 36px;
    }

    .logo img {
      height: 36px;
      width: auto;
      display: block;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-links a {
      color: #D1D1D1;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: #FFFFFF;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-right a,
    .icon-btn {
      color: #D1D1D1;
      text-decoration: none;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      transition: color 0.2s;
    }

    .nav-right a:hover,
    .icon-btn:hover {
      color: #FFFFFF;
    }

    /* --- Main Split Layout --- */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 60px;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      gap: 56px;
    }

    /* Left Hero + Rocket Graphic */
    .hero-section {
      display: flex;
      align-items: center;
      gap: 36px;
      flex: 1;
      justify-content: flex-end;
    }

    .hero-title {
      font-size: 56px;
      font-weight: 500;
      line-height: 1.08;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .rocket-art {
      width: 280px;
      height: auto;
      display: block;
      flex-shrink: 0;
    }

    /* Center Vertical Divider */
    .vertical-divider {
      width: 1px;
      height: 410px;
      background-color: #4A4A4A;
      flex-shrink: 0;
    }

    /* Right Auth Form Column */
    .auth-section {
      width: 100%;
      max-width: 390px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .auth-btn {
      width: 100%;
      height: 50px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 500;
      display: flex;
      align-items: center;
      padding: 0 18px;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.2s ease, border-color 0.2s ease;
    }

    .auth-btn:active {
      transform: scale(0.99);
    }

    /* Google Button */
    .btn-google {
      background-color: #FFFFFF;
      color: #5F6368;
      border: none;
      gap: 14px;
    }

    .btn-google:hover {
      background-color: #F1F3F4;
    }

    /* Microsoft Button (Official Dark Mode Styling) */
    .btn-microsoft {
      background-color: #1F1F1F;
      color: #FFFFFF;
      border: 1px solid #3A3A3A;
      gap: 14px;
    }

    .btn-microsoft:hover {
      background-color: #2B2B2B;
      border-color: #555555;
    }

    /* GitHub Button (Official Dark Mode Styling) */
    .btn-github {
      background-color: #24292F;
      color: #FFFFFF;
      border: 1px solid #3A3A3A;
      gap: 14px;
    }

    .btn-github:hover {
      background-color: #32383F;
      border-color: #555555;
    }


    /* Horizontal "or" Divider */
    .or-divider {
      display: flex;
      align-items: center;
      gap: 14px;
      color: #A0A0A0;
      font-size: 14px;
      margin: 4px 0;
    }

    .or-divider::before,
    .or-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background-color: #4A4A4A;
    }

    /* Email Input Box */
    #email-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    #email-input {
      width: 100%;
      height: 50px;
      background-color: #161616;
      border: 1px solid #3A3A3A;
      border-radius: 14px;
      padding: 0 18px;
      color: #FFFFFF;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    #email-input::placeholder {
      color: #7A7A7A;
      opacity: 1;
    }

    #email-input:focus {
      border-color: #FFFFFF;
    }

    /* Launch Submit Button */
    .btn-launch {
      background-color: #555555;
      color: #FFFFFF;
      border: none;
      justify-content: center;
      font-weight: 500;
    }

    .btn-launch:hover {
      background-color: #686868;
    }

    /* Status / Verification Code Feedback */
    #auth-status {
      font-size: 13px;
      color: #A3E635;
      text-align: center;
      min-height: 18px;
    }

    #auth-status.error {
      color: #F87171;
    }

    /* Legal Footer Text */
    .legal-text {
      font-size: 13px;
      color: #CCCCCC;
      text-align: center;
      line-height: 1.45;
      margin-top: 6px;
    }

    .legal-text a {
      color: #FFFFFF;
      text-decoration: underline;
    }

    /* Responsive Adjustments for Mobile/Tablet */
    @media (max-width: 960px) {
      header {
        padding: 16px 20px;
      }
      .nav-links {
        display: none;
      }
      main {
        flex-direction: column;
        padding: 30px 24px;
        gap: 32px;
      }
      .hero-section {
        flex-direction: column;
        text-align: center;
      }
      .hero-title {
        font-size: 40px;
      }
      .rocket-art {
        width: 210px;
      }
      .vertical-divider {
        width: 100%;
        max-width: 390px;
        height: 1px;
      }
    }
  </style>
</head>

        <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
        <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>

</header>

<!-- Main Content -->
<main>
  <!-- Left Column: Hero Title + Rocket Image -->
  <section class="hero-section">
    <h1 class="hero-title">Ready to<br>Launch?</h1>
    <!-- Replace "rocket.png" with your actual rocket image path -->
    <img src="../public/Screenshot%202026-11-21%20135954.png" alt="Rocket on launchpad" class="rocket-art" />
  </section>

  <!-- Center Vertical Divider -->
  <div class="vertical-divider"></div>

  <!-- Right Column: Authentication Card -->
  <section class="auth-section">
    <!-- Continue with Google Button -->
    <button id="google-btn" type="button" class="auth-btn btn-google">

        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>

    <!-- Continue with Microsoft Button -->
    <button id="microsoft-btn" type="button" class="auth-btn btn-microsoft">

        <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
        <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>

    <form id="email-form">
      <input
              type="email"

    <p id="auth-status"></p>

    <p class="legal-text">

</main>

<script
        defer
        crossorigin="anonymous"
        data-clerk-publishable-key="pk_live_Y2xlcmsuaXJvbmdhdGVpbmR1c3RyaWVzLmNvbSQ"
        src="https://clerk.irongateindustries.com/npm/@clerk/clerk-js@6/dist/clerk.browser.js"
        type="text/javascript">
</script>

<script>
  window.addEventListener('DOMContentLoaded', async function () {
    const statusEl = document.getElementById('auth-status');

    // Wait briefly in case the network is still fetching clerk.browser.js
    let attempts = 0;
    while (!window.Clerk && attempts < 40) {
      await new Promise((r) => setTimeout(r, 100));
      attempts++;
    }

    if (!window.Clerk) {
      statusEl.textContent = 'Could not connect to clerk.irongateindustries.com. Check your DNS records in Clerk.';
      statusEl.classList.add('error');
      return;
    }

    await window.Clerk.load();

    if (window.Clerk.user) {
      window.location.href = '/payload-bay.html';
      return;
    }

    const callbackUrl = new URL('sso-callback.html', window.location.href).href;
    const dashboardUrl = new URL('payload-bay.html', window.location.href).href;

    // 1. Continue with Google
    document.getElementById('google-btn').addEventListener('click', () => {
      window.Clerk.client.signIn.authenticateWithRedirect({
        strategy: 'oauth_google',
        redirectUrl: '/sso-callback.html',
        redirectUrlComplete: '/payload-bay.html'
      });
    });

    // 2. Continue with Microsoft
    document.getElementById('microsoft-btn').addEventListener('click', () => {
      window.Clerk.client.signIn.authenticateWithRedirect({
        strategy: 'oauth_microsoft',
        redirectUrl: '/sso-callback.html',
        redirectUrlComplete: '/payload-bay.html'
      });
    });

    // 3. Continue with GitHub
    const githubBtn = document.getElementById('github-btn');
    if (githubBtn) {
      githubBtn.addEventListener('click', () => {
        window.Clerk.client.signIn.authenticateWithRedirect({
          strategy: 'oauth_github',
          redirectUrl: '/sso-callback.html',
          redirectUrlComplete: '/payload-bay.html'
        });
      });
    }

    // 4. Continue with Email ("Launch!" button)
    document.getElementById('email-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email-input').value.trim();
      statusEl.classList.remove('error');
      statusEl.textContent = 'Sending verification code to ' + email + '...';

      try {
        const signInAttempt = await window.Clerk.client.signIn.create({
          identifier: email,
        });

        const emailCodeFactor = signInAttempt.supportedFirstFactors.find(
                (factor) => factor.strategy === 'email_code'
        );

        if (emailCodeFactor) {
          await signInAttempt.prepareFirstFactor({
            strategy: 'email_code',
            emailAddressId: emailCodeFactor.emailAddressId,
          });
          statusEl.textContent = 'Check your inbox! We sent a verification code to ' + email + '.';
        }
      } catch (err) {
        try {
          const signUpAttempt = await window.Clerk.client.signUp.create({
            emailAddress: email,
          });
          await signUpAttempt.prepareEmailAddressVerification({ strategy: 'email_code' });
          statusEl.textContent = 'Welcome aboard! Check your inbox for a sign-up verification code.';
        } catch (signUpErr) {
          statusEl.classList.add('error');
          statusEl.textContent = (signUpErr.errors && signUpErr.errors && signUpErr.errors.message) || 'Could not send email. Check Clerk settings.';
        }
      }
    });
  });
</script>
