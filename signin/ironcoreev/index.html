<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In to IronC | Iron Gate Industries</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- Top Navigation Bar --- */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      font-size: 14px;
    }
    .nav-left { display: flex; align-items: center; gap: 36px; }
    .logo img { height: 36px; width: auto; display: block; }
    .nav-links { display: flex; align-items: center; gap: 28px; }
    .nav-links a {
      color: #D1D1D1;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: #FFFFFF; }

    /* --- Dropdown Menu for "Systems" --- */
    .nav-dropdown { position: relative; display: inline-block; }
    .nav-dropdown-btn {
      background: none;
      border: none;
      color: #D1D1D1;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 0;
      transition: color 0.2s;
    }
    .nav-dropdown-btn:hover,
    .nav-dropdown.open .nav-dropdown-btn { color: #FFFFFF; }
    .nav-dropdown-btn .chevron { transition: transform 0.2s ease; display: inline-block; }
    .nav-dropdown.open .chevron { transform: rotate(180deg); }
    .dropdown-menu {
      display: none;
      position: absolute;
      top: calc(100% + 12px);
      left: 0;
      min-width: 170px;
      background-color: #111111;
      border: 1px solid #2E2E2E;
      border-radius: 12px;
      padding: 6px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.75);
      z-index: 100;
      flex-direction: column;
      gap: 2px;
    }
    .nav-dropdown.open .dropdown-menu { display: flex; }
    .dropdown-menu a {
      color: #D1D1D1;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      display: block;
      transition: background-color 0.15s, color 0.15s;
    }
    .dropdown-menu a:hover { background-color: #1F1F1F; color: #FFFFFF; }

    .nav-right { display: flex; align-items: center; gap: 24px; }
    .nav-right a,
    .icon-btn {
      color: #D1D1D1;
      text-decoration: none;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      transition: color 0.2s;
    }
    .nav-right a:hover,
    .icon-btn:hover { color: #FFFFFF; }

    /* --- Main Split Layout --- */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 60px;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      gap: 56px;
    }
    .hero-section {
      display: flex;
      align-items: center;
      gap: 36px;
      flex: 1;
      justify-content: flex-end;
    }
    .hero-title {
      font-size: 52px;
      font-weight: 500;
      line-height: 1.1;
      letter-spacing: -0.02em;
      max-width: 460px;
      text-align: right;
    }
    .hero-title .hero-sub { display: block; color: #A0A0A0; }
    .vertical-divider { width: 1px; height: 410px; background-color: #4A4A4A; flex-shrink: 0; }

    /* Right Auth Form Column */
    .auth-section {
      width: 100%;
      max-width: 390px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .auth-btn {
      width: 100%;
      height: 50px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 500;
      display: flex;
      align-items: center;
      padding: 0 18px;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.2s ease, border-color 0.2s ease;
    }
    .auth-btn:active { transform: scale(0.99); }
    .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-google { background-color: #FFFFFF; color: #5F6368; border: none; gap: 14px; }
    .btn-google:hover { background-color: #F1F3F4; }
    .btn-microsoft { background-color: #1F1F1F; color: #FFFFFF; border: 1px solid #3A3A3A; gap: 14px; }
    .btn-microsoft:hover { background-color: #2B2B2B; border-color: #555555; }
    .btn-github { background-color: #24292F; color: #FFFFFF; border: 1px solid #3A3A3A; gap: 14px; }
    .btn-github:hover { background-color: #32383F; border-color: #555555; }

    .or-divider {
      display: flex;
      align-items: center;
      gap: 14px;
      color: #A0A0A0;
      font-size: 14px;
      margin: 4px 0;
    }
    .or-divider::before,
    .or-divider::after { content: ""; flex: 1; height: 1px; background-color: #4A4A4A; }

    #email-form { display: flex; flex-direction: column; gap: 16px; }
    #email-input {
      width: 100%;
      height: 50px;
      background-color: #161616;
      border: 1px solid #3A3A3A;
      border-radius: 14px;
      padding: 0 18px;
      color: #FFFFFF;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s ease;
    }
    #email-input::placeholder { color: #7A7A7A; opacity: 1; }
    #email-input:focus { border-color: #FFFFFF; }

    .btn-launch { background-color: #555555; color: #FFFFFF; border: none; justify-content: center; font-weight: 500; }
    .btn-launch:hover:not(:disabled) { background-color: #686868; }

    #auth-status { font-size: 13px; color: #A3E635; text-align: center; min-height: 18px; }
    #auth-status.error { color: #F87171; }

    .legal-text { font-size: 13px; color: #CCCCCC; text-align: center; line-height: 1.45; margin-top: 6px; }
    .legal-text a { color: #FFFFFF; text-decoration: underline; }

    @media (max-width: 960px) {
      header { padding: 16px 20px; }
      .nav-links { display: none; }
      main { flex-direction: column; padding: 30px 24px; gap: 32px; }
      .hero-section { flex-direction: column; text-align: center; }
      .hero-title { font-size: 36px; text-align: center; max-width: 100%; }
      .vertical-divider { width: 100%; max-width: 390px; height: 1px; }
    }

    /* --- Slide-Down Auth Modal Overlay --- */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding: 20px;
    }
    .modal-backdrop.active { opacity: 1; pointer-events: auto; }

    .auth-modal {
      background-color: #0F0F0F;
      border: 1px solid #2E2E2E;
      border-radius: 20px;
      width: 100%;
      max-width: 410px;
      padding: 32px 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.9);
      position: relative;
      transform: translateY(-48px);
      opacity: 0;
      transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
    }
    .modal-backdrop.active .auth-modal { transform: translateY(0); opacity: 1; }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 18px;
      background: none;
      border: none;
      color: #888888;
      font-size: 22px;
      cursor: pointer;
      line-height: 1;
    }
    .modal-close:hover { color: #FFFFFF; }
    .modal-title { font-size: 22px; font-weight: 500; margin-bottom: 8px; color: #FFFFFF; }
    .modal-subtitle { font-size: 14px; color: #9A9A9A; line-height: 1.45; margin-bottom: 22px; }
    .modal-form { display: flex; flex-direction: column; gap: 14px; }
    .modal-input {
      width: 100%;
      height: 48px;
      background-color: #181818;
      border: 1px solid #363636;
      border-radius: 12px;
      padding: 0 16px;
      color: #FFFFFF;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    .modal-input:focus { border-color: #FFFFFF; }
    .modal-input.code-input { text-align: center; letter-spacing: 8px; font-size: 20px; font-weight: 600; }
    .modal-submit {
      width: 100%;
      height: 48px;
      border-radius: 12px;
      border: none;
      background-color: #FFFFFF;
      color: #000000;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      transition: background-color 0.2s;
    }
    .modal-submit:hover:not(:disabled) { background-color: #E5E5E5; }
    .modal-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .modal-error { font-size: 13px; color: #F87171; text-align: center; min-height: 18px; margin-top: 6px; }
    .hidden-step { display: none !important; }

    /* --- Desktop (IronC) sign-in states --- */
    #desktop-notice {
      display: none;
      font-size: 13px;
      line-height: 1.45;
      color: #D1D1D1;
      background-color: #161616;
      border: 1px solid #3A3A3A;
      border-radius: 12px;
      padding: 12px 14px;
      text-align: center;
    }
    #desktop-notice.show { display: block; }
    #desktop-notice.error { color: #F87171; border-color: #5A2A2A; }
    #desktop-notice.ok { color: #A3E635; border-color: #3B5A1A; }
    #switch-account-btn {
      display: none;
      background: none;
      border: none;
      color: #FFFFFF;
      text-decoration: underline;
      font-size: 13px;
      cursor: pointer;
      margin: 0 auto;
    }
    #switch-account-btn.show { display: block; }
  </style>
</head>

<!-- Auth modal (all three steps) -->
<div class="modal-backdrop" id="auth-modal-backdrop">
  <div class="auth-modal" role="dialog" aria-modal="true">
    <button type="button" class="modal-close" id="modal-close-btn" aria-label="Close">&times;</button>

    <!-- New user: verify email code -->
    <div id="step-verify-code" class="hidden-step">
      <h2 class="modal-title">Check your email</h2>
      <p class="modal-subtitle" id="verify-subtitle"></p>
      <form id="code-form" class="modal-form">
        <input type="text" id="otp-input" class="modal-input code-input" inputmode="numeric"
               autocomplete="one-time-code" maxlength="6" placeholder="000000" required />
        <button type="submit" class="modal-submit">Verify</button>
      </form>
    </div>

    <!-- New user: name + password -->
    <div id="step-complete-signup" class="hidden-step">
      <h2 class="modal-title">Finish creating your account</h2>
      <p class="modal-subtitle">Tell us your name and choose a password.</p>
      <form id="signup-details-form" class="modal-form">
        <input type="text" id="fullname-input" class="modal-input" placeholder="Full name" autocomplete="name" required />
        <input type="password" id="new-password-input" class="modal-input" placeholder="Password" autocomplete="new-password" required />
        <input type="password" id="confirm-password-input" class="modal-input" placeholder="Confirm password" autocomplete="new-password" required />
        <button type="submit" class="modal-submit">Create account</button>
      </form>
    </div>

    <!-- Existing user: password -->
    <div id="step-existing-password" class="hidden-step">
      <h2 class="modal-title" id="welcome-back-title">Welcome back</h2>
      <p class="modal-subtitle" id="welcome-back-subtitle"></p>
      <form id="existing-password-form" class="modal-form">
        <!-- Hidden username field so the browser knows which saved password to autofill -->
        <input type="email" id="existing-username" autocomplete="username" tabindex="-1" aria-hidden="true"
               style="position:absolute;opacity:0;height:0;width:0;pointer-events:none;" />
        <input type="password" id="existing-password-input" class="modal-input" placeholder="Password" autocomplete="current-password" required />
        <button type="submit" class="modal-submit">Sign in</button>
      </form>
    </div>

    <p class="modal-error" id="modal-error-text"></p>
  </div>
</div>

<script
        defer
        crossorigin="anonymous"
        data-clerk-publishable-key="pk_live_Y2xlcmsuaXJvbmdhdGVpbmR1c3RyaWVzLmNvbSQ"
        src="https://clerk.irongateindustries.com/npm/@clerk/clerk-js@6/dist/clerk.browser.js"
        type="text/javascript">
</script>

<script>
  (function () {
    const $ = (id) => document.getElementById(id);

    // ===== CONFIG: your Cloudflare Worker URL (no trailing slash). See SETUP.md step 4. =====
    const API_BASE = 'https://ironc-auth.byronvareladiaz.workers.dev/';

    // ---- Desktop request from IronC: ?code_challenge=...&state=...&port=... ----
    // These values are only used to START the flow. Nothing in the URL grants access:
    // the server decides, using the Clerk session plus the license table.
    const desktopReq = (function () {
      const p = new URLSearchParams(window.location.search);
      const challenge = p.get('code_challenge') || '';
      const state = p.get('state') || '';
      const port = parseInt(p.get('port') || '', 10);
      if (!/^[A-Za-z0-9_-]{43}$/.test(challenge)) return null;
      if (!/^[A-Za-z0-9_-]{16,128}$/.test(state)) return null;
      if (!(port >= 1024 && port <= 65535)) return null;
      return { challenge, state, port };
    })();

    // ---- Systems dropdown ----
    const systemsDropdown = $('systems-dropdown');
    const systemsBtn = $('systems-btn');
    if (systemsBtn && systemsDropdown) {
      systemsBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = systemsDropdown.classList.toggle('open');
        systemsBtn.setAttribute('aria-expanded', String(isOpen));
      });
      document.addEventListener('click', (e) => {
        if (!systemsDropdown.contains(e.target)) {
          systemsDropdown.classList.remove('open');
          systemsBtn.setAttribute('aria-expanded', 'false');
        }
      });
    }

    // ---- Payload Bay badge (hidden at 0, matches the homepage) ----
    function updatePayloadBadge() {
      try {
        const cart = JSON.parse(localStorage.getItem('irongate_payload_bay')) || [];
        const total = cart.reduce((sum, item) => sum + (item.qty || 1), 0);
        const badge = $('nav-bay-count');
        if (badge) badge.textContent = total > 0 ? ` (${total})` : '';
      } catch (e) { /* ignore storage errors */ }
    }
    updatePayloadBadge();
    window.addEventListener('storage', updatePayloadBadge);

    // Until Clerk is ready, don't let the form do a native page-reload submit
    $('email-form').addEventListener('submit', (e) => e.preventDefault());

    // ---- Clerk auth ----
    window.addEventListener('load', async function () {
      const statusEl = $('auth-status');
      const backdrop = $('auth-modal-backdrop');
      const modalError = $('modal-error-text');
      const launchBtn = $('launch-btn');

      const steps = {
        verify: $('step-verify-code'),
        signup: $('step-complete-signup'),
        password: $('step-existing-password')
      };

      const setStatus = (msg, isError) => {
        statusEl.textContent = msg || '';
        statusEl.classList.toggle('error', !!isError);
      };
      const errMsg = (err, fallback) =>
              (err && err.errors && err.errors[0] && (err.errors[0].longMessage || err.errors[0].message)) || fallback;

      // Wait up to 5s for the async Clerk script to attach window.Clerk
      let attempts = 0;
      while (!window.Clerk && attempts < 50) {
        await new Promise((r) => setTimeout(r, 100));
        attempts++;
      }
      if (!window.Clerk) {
        setStatus('Could not load Clerk. Check the script tags, your connection, and that this domain is allowed.', true);
        return;
      }

      const clerk = window.Clerk;
      try {
        await clerk.load({ ui: { ClerkUI: window.__internal_ClerkUICtor } });
      } catch (err) {
        setStatus('Clerk load failed: ' + (err.message || err), true);
        return;
      }

      const noticeEl = $('desktop-notice');
      const switchBtn = $('switch-account-btn');
      function showNotice(msg, kind) {
        noticeEl.textContent = msg || '';
        noticeEl.className = msg ? 'show' + (kind ? ' ' + kind : '') : '';
      }

      switchBtn.addEventListener('click', async () => {
        try { await clerk.signOut(); } catch (e) { /* ignore */ }
        window.location.reload(); // keeps the IronC request in the URL
      });

      // Ask the backend to verify the Clerk session + license, then hand IronC a one-time code.
      async function completeDesktopAuth() {
        setStatus('');
        switchBtn.classList.remove('show');
        showNotice('Checking your IronC Early Access license...');
        try {
          const token = await clerk.session.getToken();
          if (!token) throw new Error('no_session');

          const res = await fetch(API_BASE + '/auth/authorize', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ clerk_token: token, code_challenge: desktopReq.challenge })
          });
          let data = {};
          try { data = await res.json(); } catch (e) { /* non-JSON error */ }

          if (res.ok && data.code) {
            showNotice('Success! Returning you to IronC... You can close this tab afterwards.', 'ok');
            window.location.replace(
              'http://127.0.0.1:' + desktopReq.port + '/callback' +
              '?code=' + encodeURIComponent(data.code) +
              '&state=' + encodeURIComponent(desktopReq.state)
            );
            return;
          }

          const email = clerk.user && clerk.user.primaryEmailAddress
                  ? clerk.user.primaryEmailAddress.emailAddress : 'this account';
          if (res.status === 403 && data.error === 'no_license') {
            showNotice('The account ' + email + ' does not have an active IronC Early Access license. ' +
                    'If you think this is a mistake, contact IronGate Industries, or sign in with a different account.', 'error');
          } else if (res.status === 401) {
            showNotice('We could not verify your sign-in. Please sign in again.', 'error');
          } else {
            showNotice('Something went wrong while authorizing IronC. Please try again.', 'error');
          }
        } catch (err) {
          showNotice('Could not reach the IronGate license server. Check your connection and try again.', 'error');
        }
        switchBtn.classList.add('show');
      }

      let activeSignIn = null;
      let activeSignUp = null;

      function openStep(name) {
        modalError.textContent = '';
        Object.values(steps).forEach((el) => el.classList.add('hidden-step'));
        steps[name].classList.remove('hidden-step');
        backdrop.classList.add('active');
      }
      function closeModal() { backdrop.classList.remove('active'); }

      $('modal-close-btn').addEventListener('click', closeModal);
      backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeModal(); });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

      // Disable a form's submit button while a request is in flight
      async function withBusy(form, fn) {
        const btn = form.querySelector('button[type="submit"]');
        if (btn) btn.disabled = true;
        try { await fn(); } finally { if (btn) btn.disabled = false; }
      }

      async function finishLogin(sessionId) {
        await clerk.setActive({ session: sessionId });
        closeModal();
        if (desktopReq) {
          await completeDesktopAuth();
        } else {
          window.location.href = '/';
        }
      }

      // ---- OAuth buttons ----
      function oauth(strategy) {
        return async () => {
          setStatus('');
          try {
            await clerk.client.signIn.authenticateWithRedirect({
              strategy,
              redirectUrl: '/sso-callback.html',
              // Come back to THIS page (with the IronC request still in the URL)
              redirectUrlComplete: window.location.pathname + window.location.search
            });
          } catch (err) {
            setStatus(errMsg(err, 'Could not start sign-in.'), true);
          }
        };
      }
      $('google-btn').addEventListener('click', oauth('oauth_google'));
      $('microsoft-btn').addEventListener('click', oauth('oauth_microsoft'));
      $('github-btn').addEventListener('click', oauth('oauth_github'));

      // ---- STEP 1: email -> existing user (password) or new user (email code) ----
      $('email-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = $('email-input').value.trim();
        setStatus('Checking account...');
        launchBtn.disabled = true;

        try {
          // Does an account exist for this email?
          let existing = true;
          try {
            activeSignIn = await clerk.client.signIn.create({ identifier: email });
          } catch (err) {
            // Only treat "not found" as "new user". Any other error (rate limit,
            // network, etc.) is shown as an error instead of starting a sign-up.
            if (err && err.errors && err.errors[0] && err.errors[0].code === 'form_identifier_not_found') {
              existing = false;
            } else {
              throw err;
            }
          }

          if (existing) {
            const hasPassword = (activeSignIn.supportedFirstFactors || []).some((f) => f.strategy === 'password');
            if (!hasPassword) {
              setStatus('This account has no password. Use Google, Microsoft or GitHub above.', true);
              return;
            }
            const first = activeSignIn.userData && activeSignIn.userData.firstName;
            $('welcome-back-title').textContent = first ? `Welcome back, ${first}` : 'Welcome back';
            $('welcome-back-subtitle').textContent = `Enter the password for ${email} to continue.`;
            $('existing-password-input').value = '';
            $('existing-username').value = email;
            setStatus('');
            openStep('password');
            $('existing-password-input').focus();
          } else {
            activeSignUp = await clerk.client.signUp.create({ emailAddress: email });
            await activeSignUp.prepareEmailAddressVerification({ strategy: 'email_code' });
            $('verify-subtitle').textContent = `We sent a 6-digit verification code to ${email}. Enter it below.`;
            $('otp-input').value = '';
            setStatus('');
            openStep('verify');
            $('otp-input').focus();
          }
        } catch (err) {
          setStatus(errMsg(err, 'Something went wrong. Please try again.'), true);
        } finally {
          launchBtn.disabled = false;
        }
      });

      // ---- STEP 2A (new user): verify 6-digit code ----
      $('code-form').addEventListener('submit', (e) => {
        e.preventDefault();
        withBusy(e.target, async () => {
          modalError.textContent = '';
          try {
            const result = await activeSignUp.attemptEmailAddressVerification({ code: $('otp-input').value.trim() });
            if (result.status === 'complete') {
              await finishLogin(result.createdSessionId);
            } else if (result.status === 'missing_requirements') {
              openStep('signup');
              $('fullname-input').focus();
            } else {
              modalError.textContent = 'Unexpected sign-up status: ' + result.status;
            }
          } catch (err) {
            modalError.textContent = errMsg(err, 'Invalid verification code.');
          }
        });
      });

      // ---- STEP 2B (new user): name + password ----
      $('signup-details-form').addEventListener('submit', (e) => {
        e.preventDefault();
        withBusy(e.target, async () => {
          modalError.textContent = '';
          const fullName = $('fullname-input').value.trim();
          const password = $('new-password-input').value;
          if (password !== $('confirm-password-input').value) {
            modalError.textContent = 'Passwords do not match. Please try again.';
            return;
          }
          const parts = fullName.split(/\s+/);
          const firstName = parts[0] || '';
          const lastName = parts.slice(1).join(' ');

          try {
            const result = await activeSignUp.update({ firstName, lastName, password });
            if (result.status === 'complete') {
              await finishLogin(result.createdSessionId);
            } else {
              modalError.textContent = 'Additional verification required: ' + result.status;
            }
          } catch (err) {
            modalError.textContent = errMsg(err, 'Could not create account.');
          }
        });
      });

      // ---- STEP 3 (existing user): password ----
      $('existing-password-form').addEventListener('submit', (e) => {
        e.preventDefault();
        withBusy(e.target, async () => {
          modalError.textContent = '';
          try {
            const result = await activeSignIn.attemptFirstFactor({
              strategy: 'password',
              password: $('existing-password-input').value
            });
            if (result.status === 'complete') {
              await finishLogin(result.createdSessionId);
            } else {
              modalError.textContent = 'Additional verification required: ' + result.status;
            }
          } catch (err) {
            modalError.textContent = errMsg(err, 'Incorrect password.');
          }
        });
      });

      // ---- Already signed in (or just returned from Google/Microsoft/GitHub) ----
      if (clerk.user) {
        if (desktopReq) {
          await completeDesktopAuth();
        } else {
          window.location.href = '/';
        }
        return;
      }

      if (!desktopReq) {
        showNotice('To sign in to the IronC app, click "Log In with an IronGate Account" inside IronC. ' +
                'This page was opened without a request from the app.');
      }

      // ---- Opened from "Switch account": prefill the email and jump to the password step ----
      const prefill = new URLSearchParams(window.location.search).get('email');
      if (prefill) {
        $('email-input').value = prefill;
        $('email-form').requestSubmit();
      }
    });
  })();
</script>

</body>
</html>
