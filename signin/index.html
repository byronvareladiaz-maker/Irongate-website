<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | Iron Gate Industries</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- Top Navigation Bar --- */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      font-size: 14px;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 36px;
    }

    .logo img {
      height: 36px;
      width: auto;
      display: block;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-links a {
      color: #D1D1D1;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: #FFFFFF;
    }

    /* --- Dropdown Menu for "Systems" --- */
    .nav-dropdown {
      position: relative;
      display: inline-block;
    }

    .nav-dropdown-btn {
      background: none;
      border: none;
      color: #D1D1D1;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 0;
      transition: color 0.2s;
    }

    .nav-dropdown-btn:hover,
    .nav-dropdown.open .nav-dropdown-btn {
      color: #FFFFFF;
    }

    .nav-dropdown-btn .chevron {
      transition: transform 0.2s ease;
      display: inline-block;
    }

    .nav-dropdown.open .chevron {
      transform: rotate(180deg);
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: calc(100% + 12px);
      left: 0;
      min-width: 170px;
      background-color: #111111;
      border: 1px solid #2E2E2E;
      border-radius: 12px;
      padding: 6px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.75);
      z-index: 100;
      flex-direction: column;
      gap: 2px;
    }

    .nav-dropdown.open .dropdown-menu {
      display: flex;
    }

    .dropdown-menu a {
      color: #D1D1D1;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      display: block;
      transition: background-color 0.15s, color 0.15s;
    }

    .dropdown-menu a:hover {
      background-color: #1F1F1F;
      color: #FFFFFF;
    }


    .nav-right {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-right a,
    .icon-btn {
      color: #D1D1D1;
      text-decoration: none;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      transition: color 0.2s;
    }

    .nav-right a:hover,
    .icon-btn:hover {
      color: #FFFFFF;
    }

    /* --- Main Split Layout --- */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 60px;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      gap: 56px;
    }

    /* Left Hero + Rocket Graphic */
    .hero-section {
      display: flex;
      align-items: center;
      gap: 36px;
      flex: 1;
      justify-content: flex-end;
    }

    .hero-title {
      font-size: 56px;
      font-weight: 500;
      line-height: 1.08;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .rocket-art {
      width: 280px;
      height: auto;
      display: block;
      flex-shrink: 0;
    }

    /* Center Vertical Divider */
    .vertical-divider {
      width: 1px;
      height: 410px;
      background-color: #4A4A4A;
      flex-shrink: 0;
    }

    /* Right Auth Form Column */
    .auth-section {
      width: 100%;
      max-width: 390px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .auth-btn {
      width: 100%;
      height: 50px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 500;
      display: flex;
      align-items: center;
      padding: 0 18px;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.2s ease, border-color 0.2s ease;
    }

    .auth-btn:active {
      transform: scale(0.99);
    }

    /* Google Button */
    .btn-google {
      background-color: #FFFFFF;
      color: #5F6368;
      border: none;
      gap: 14px;
    }

    .btn-google:hover {
      background-color: #F1F3F4;
    }

    /* Microsoft Button (Official Dark Mode Styling) */
    .btn-microsoft {
      background-color: #1F1F1F;
      color: #FFFFFF;
      border: 1px solid #3A3A3A;
      gap: 14px;
    }

    .btn-microsoft:hover {
      background-color: #2B2B2B;
      border-color: #555555;
    }

    /* GitHub Button (Official Dark Mode Styling) */
    .btn-github {
      background-color: #24292F;
      color: #FFFFFF;
      border: 1px solid #3A3A3A;
      gap: 14px;
    }

    .btn-github:hover {
      background-color: #32383F;
      border-color: #555555;
    }


    /* Horizontal "or" Divider */
    .or-divider {
      display: flex;
      align-items: center;
      gap: 14px;
      color: #A0A0A0;
      font-size: 14px;
      margin: 4px 0;
    }

    .or-divider::before,
    .or-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background-color: #4A4A4A;
    }

    /* Email Input Box */
    #email-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    #email-input {
      width: 100%;
      height: 50px;
      background-color: #161616;
      border: 1px solid #3A3A3A;
      border-radius: 14px;
      padding: 0 18px;
      color: #FFFFFF;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    #email-input::placeholder {
      color: #7A7A7A;
      opacity: 1;
    }

    #email-input:focus {
      border-color: #FFFFFF;
    }

    /* Launch Submit Button */
    .btn-launch {
      background-color: #555555;
      color: #FFFFFF;
      border: none;
      justify-content: center;
      font-weight: 500;
    }

    .btn-launch:hover {
      background-color: #686868;
    }

    /* Status / Verification Code Feedback */
    #auth-status {
      font-size: 13px;
      color: #A3E635;
      text-align: center;
      min-height: 18px;
    }

    #auth-status.error {
      color: #F87171;
    }

    /* Legal Footer Text */
    .legal-text {
      font-size: 13px;
      color: #CCCCCC;
      text-align: center;
      line-height: 1.45;
      margin-top: 6px;
    }

    .legal-text a {
      color: #FFFFFF;
      text-decoration: underline;
    }

    /* Responsive Adjustments for Mobile/Tablet */
    @media (max-width: 960px) {
      header {
        padding: 16px 20px;
      }
      .nav-links {
        display: none;
      }
      main {
        flex-direction: column;
        padding: 30px 24px;
        gap: 32px;
      }
      .hero-section {
        flex-direction: column;
        text-align: center;
      }
      .hero-title {
        font-size: 40px;
      }
      .rocket-art {
        width: 210px;
      }
      .vertical-divider {
        width: 100%;
        max-width: 390px;
        height: 1px;
      }
    }

    /* --- Slide-Down Auth Modal Overlay --- */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding: 20px;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .auth-modal {
      background-color: #0F0F0F;
      border: 1px solid #2E2E2E;
      border-radius: 20px;
      width: 100%;
      max-width: 410px;
      padding: 32px 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.9);
      position: relative;
      /* Starts slightly above center and slides down when .active */
      transform: translateY(-48px);
      opacity: 0;
      transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
    }

    .modal-backdrop.active .auth-modal {
      transform: translateY(0);
      opacity: 1;
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 18px;
      background: none;
      border: none;
      color: #888888;
      font-size: 22px;
      cursor: pointer;
      line-height: 1;
    }

    .modal-close:hover {
      color: #FFFFFF;
    }

    .modal-title {
      font-size: 22px;
      font-weight: 500;
      margin-bottom: 8px;
      color: #FFFFFF;
    }

    .modal-subtitle {
      font-size: 14px;
      color: #9A9A9A;
      line-height: 1.45;
      margin-bottom: 22px;
    }

    .modal-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-input {
      width: 100%;
      height: 48px;
      background-color: #181818;
      border: 1px solid #363636;
      border-radius: 12px;
      padding: 0 16px;
      color: #FFFFFF;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .modal-input:focus {
      border-color: #FFFFFF;
    }

    .modal-input.code-input {
      text-align: center;
      letter-spacing: 8px;
      font-size: 20px;
      font-weight: 600;
    }

    .modal-submit {
      width: 100%;
      height: 48px;
      border-radius: 12px;
      border: none;
      background-color: #FFFFFF;
      color: #000000;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      transition: background-color 0.2s;
    }

    .modal-submit:hover {
      background-color: #E5E5E5;
    }

    .modal-error {
      font-size: 13px;
      color: #F87171;
      text-align: center;
      min-height: 18px;
      margin-top: 6px;
    }

    .hidden-step {
      display: none !important;
    }

  </style>
</head>

<!-- Complete Page Logic: Dropdown, Payload Bay Badge, Slide-Down Modal & Clerk Auth -->
<script>
  // 1. Systems Dropdown Menu Toggle
  const systemsDropdown = document.getElementById('systems-dropdown');
  const systemsBtn = document.getElementById('systems-btn');

  if (systemsBtn && systemsDropdown) {
    systemsBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = systemsDropdown.classList.toggle('open');
      systemsBtn.setAttribute('aria-expanded', isOpen);
    });

    document.addEventListener('click', (e) => {
      if (!systemsDropdown.contains(e.target)) {
        systemsDropdown.classList.remove('open');
        systemsBtn.setAttribute('aria-expanded', 'false');
      }
    });
  }

  // 2. Live Payload Bay Counter
  function updatePayloadBadge() {
    try {
      const cart = JSON.parse(localStorage.getItem('irongate_payload_bay')) || [];
      const totalUnits = cart.reduce((sum, item) => sum + (item.qty || 1), 0);
      const badge = document.getElementById('nav-bay-count');
      if (badge) {
        badge.textContent = totalUnits;
      }
    } catch (e) {
      // Ignore storage errors
    }
  }

  updatePayloadBadge();
  window.addEventListener('storage', updatePayloadBadge);

  // 3. Clerk Authentication & Slide-Down Verification Modal
  window.addEventListener('load', async function () {
    const statusEl = document.getElementById('auth-status');
    const backdrop = document.getElementById('auth-modal-backdrop');
    const modalError = document.getElementById('modal-error-text');

    const stepVerifyCode = document.getElementById('step-verify-code');
    const stepCompleteSignup = document.getElementById('step-complete-signup');
    const stepExistingPassword = document.getElementById('step-existing-password');

    let activeSignIn = null;
    let activeSignUp = null;

    function openModalStep(stepElement) {
      modalError.textContent = '';
      stepVerifyCode.classList.add('hidden-step');
      stepCompleteSignup.classList.add('hidden-step');
      stepExistingPassword.classList.add('hidden-step');
      stepElement.classList.remove('hidden-step');
      backdrop.classList.add('active');
    }

    const closeBtn = document.getElementById('modal-close-btn');
    if (closeBtn) {
      closeBtn.addEventListener('click', () => {
        backdrop.classList.remove('active');
      });
    }

    // Mount person/avatar icon in top-right corner, then redirect to main homepage
    async function finishLoginAndRedirect(sessionId) {
      await window.Clerk.setActive({ session: sessionId });
      backdrop.classList.remove('active');

      const navSlot = document.getElementById('auth-nav-slot');
      if (navSlot && window.Clerk.user) {
        navSlot.innerHTML = '<div id="user-button"></div>';
        window.Clerk.mountUserButton(document.getElementById('user-button'));
      }

      setTimeout(() => {
        window.location.href = '/';
      }, 700);
    }

    // Wait up to 5 seconds for the async Clerk SDK to attach to window.Clerk
    let attempts = 0;
    while (!window.Clerk && attempts < 50) {
      await new Promise((r) => setTimeout(r, 100));
      attempts++;
    }

    if (!window.Clerk) {
      if (statusEl) {
        statusEl.textContent = 'Clerk failed to load. Check your connection or DNS settings.';
        statusEl.classList.add('error');
      }
      return;
    }

    await window.Clerk.load();


    await window.Clerk.load();

    // If user is already logged in, display avatar icon and redirect to homepage
    if (window.Clerk.user) {
      const navSlot = document.getElementById('auth-nav-slot');
      if (navSlot) {
        navSlot.innerHTML = '<div id="user-button"></div>';
        window.Clerk.mountUserButton(document.getElementById('user-button'));
      }
      window.location.href = '/';
      return;
    }

    // Continue with Google
    const googleBtn = document.getElementById('google-btn');
    if (googleBtn) {
      googleBtn.addEventListener('click', () => {
        window.Clerk.client.signIn.authenticateWithRedirect({
          strategy: 'oauth_google',
          redirectUrl: '/sso-callback.html',
          redirectUrlComplete: '/'
        });
      });
    }

    // Continue with Microsoft
    const microsoftBtn = document.getElementById('microsoft-btn');
    if (microsoftBtn) {
      microsoftBtn.addEventListener('click', () => {
        window.Clerk.client.signIn.authenticateWithRedirect({
          strategy: 'oauth_microsoft',
          redirectUrl: '/sso-callback.html',
          redirectUrlComplete: '/'
        });
      });
    }

    // Continue with GitHub
    const githubBtn = document.getElementById('github-btn');
    if (githubBtn) {
      githubBtn.addEventListener('click', () => {
        window.Clerk.client.signIn.authenticateWithRedirect({
          strategy: 'oauth_github',
          redirectUrl: '/sso-callback.html',
          redirectUrlComplete: '/'
        });
      });
    }

    // STEP 1: User enters email and clicks "Launch!"
    const emailForm = document.getElementById('email-form');
    if (emailForm) {
      emailForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email-input').value.trim();
        if (statusEl) {
          statusEl.classList.remove('error');
          statusEl.textContent = 'Checking account...';
        }

        try {
          // Check if an account with this email already exists
          activeSignIn = await window.Clerk.client.signIn.create({
            identifier: email,
          });

          if (statusEl) statusEl.textContent = '';

          // Account exists -> Open "Welcome back" + Password modal
          const userName = activeSignIn.userData && activeSignIn.userData.firstName;
          document.getElementById('welcome-back-title').textContent =
                  userName ? `Welcome back, ${userName}` : 'Welcome back';
          document.getElementById('welcome-back-subtitle').textContent =
                  `Enter the password for ${email} to continue.`;
          document.getElementById('existing-password-input').value = '';

          openModalStep(stepExistingPassword);
          document.getElementById('existing-password-input').focus();

        } catch (err) {
          // Account does NOT exist -> Send 6-digit verification code & open Code modal
          try {
            activeSignUp = await window.Clerk.client.signUp.create({
              emailAddress: email,
            });
            await activeSignUp.prepareEmailAddressVerification({
              strategy: 'email_code',
            });

            if (statusEl) statusEl.textContent = '';
            document.getElementById('verify-subtitle').textContent =
                    `We sent a 6-digit verification code to ${email}. Enter it below.`;
            document.getElementById('otp-input').value = '';

            openModalStep(stepVerifyCode);
            document.getElementById('otp-input').focus();
          } catch (signUpErr) {
            if (statusEl) {
              statusEl.classList.add('error');
              statusEl.textContent =
                      (signUpErr.errors && signUpErr.errors[0] && (signUpErr.errors[0].longMessage || signUpErr.errors[0].message)) ||
                      'Could not start sign-up. Check Clerk settings.';
            }
          }
        }
      });
    }

    // STEP 2A (New User): Verify 6-digit email code
    const codeForm = document.getElementById('code-form');
    if (codeForm) {
      codeForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        modalError.textContent = '';
        const code = document.getElementById('otp-input').value.trim();

        try {
          const result = await activeSignUp.attemptEmailAddressVerification({ code });

          if (result.status === 'complete') {
            await finishLoginAndRedirect(result.createdSessionId);
          } else {
            // Code verified -> Transition popup to Full Name + Password + Confirm Password
            openModalStep(stepCompleteSignup);
            document.getElementById('fullname-input').focus();
          }
        } catch (err) {
          modalError.textContent =
                  (err.errors && err.errors[0] && (err.errors[0].longMessage || err.errors[0].message)) ||
                  'Invalid verification code.';
        }
      });
    }

    // STEP 2B (New User): Submit Full Name, Password & Confirm Password
    const signupDetailsForm = document.getElementById('signup-details-form');
    if (signupDetailsForm) {
      signupDetailsForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        modalError.textContent = '';

        const fullName = document.getElementById('fullname-input').value.trim();
        const password = document.getElementById('new-password-input').value;
        const confirmPassword = document.getElementById('confirm-password-input').value;

        if (password !== confirmPassword) {
          modalError.textContent = 'Passwords do not match. Please try again.';
          return;
        }

        const nameParts = fullName.split(/\s+/);
        const firstName = nameParts[0] || '';
        const lastName = nameParts.slice(1).join(' ') || '';

        try {
          const updatedSignUp = await activeSignUp.update({
            firstName,
            lastName,
            password,
          });

          if (updatedSignUp.status === 'complete') {
            await finishLoginAndRedirect(updatedSignUp.createdSessionId);
          } else {
            modalError.textContent = 'Additional verification required: ' + updatedSignUp.status;
          }
        } catch (err) {
          modalError.textContent =
                  (err.errors && err.errors[0] && (err.errors[0].longMessage || err.errors[0].message)) ||
                  'Could not create account.';
        }
      });
    }

    // STEP 3 (Existing User): Verify Password & Complete Sign In
    const existingPasswordForm = document.getElementById('existing-password-form');
    if (existingPasswordForm) {
      existingPasswordForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        modalError.textContent = '';
        const password = document.getElementById('existing-password-input').value;

        try {
          const result = await activeSignIn.attemptFirstFactor({
            strategy: 'password',
            password,
          });

          if (result.status === 'complete') {
            await finishLoginAndRedirect(result.createdSessionId);
          } else {
            modalError.textContent = 'Sign-in incomplete: ' + result.status;
          }
        } catch (err) {
          modalError.textContent =
                  (err.errors && err.errors[0] && (err.errors[0].longMessage || err.errors[0].message)) ||
                  'Incorrect password.';
        }
      });
    }
  });
</script>

</body>
</html>
