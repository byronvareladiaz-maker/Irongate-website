<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Irongate Industries</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* --- Top Navigation Bar (Matches your Sign-In page) --- */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      font-size: 14px;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 36px;
    }

    .logo img {
      height: 36px;
      width: auto;
      display: block;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-links a {
      color: #D1D1D1;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: #FFFFFF;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-right a,
    .icon-btn {
      color: #D1D1D1;
      text-decoration: none;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      transition: color 0.2s;
    }

    .nav-right a:hover,
    .icon-btn:hover {
      color: #FFFFFF;
    }

    /* --- Hero Section --- */
    .hero {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      padding: 60px 80px;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 32px;
    }

    .hero-headline {
      font-size: 46px;
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: #FFFFFF;
    }

    .btn-learn-more {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      background-color: #FFFFFF;
      color: #000000;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      border-radius: 14px;
      transition: transform 0.15s ease, background-color 0.2s ease;
    }

    .btn-learn-more:hover {
      background-color: #E5E5E5;
      transform: translateY(-1px);
    }

    /* Optional Right-Side Visual / Hardware Backdrop */
    .hero-visual {
      flex: 1;
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .hero-visual img {
      max-width: 480px;
      width: 100%;
      height: auto;
      border-radius: 20px;
      object-fit: contain;
    }

    /* Subtle Footer */
    footer {
      padding: 24px 40px;
      border-top: 1px solid #1F1F1F;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #7A7A7A;
    }

    footer a {
      color: #A0A0A0;
      text-decoration: none;
      margin-left: 20px;
    }

    footer a:hover {
      color: #FFFFFF;
    }

    @media (max-width: 960px) {
      header {
        padding: 16px 20px;
      }
      .nav-links {
        display: none;
      }
      .hero {
        flex-direction: column;
        padding: 40px 24px;
        text-align: left;
      }
      .hero-headline {
        font-size: 32px;
      }
      footer {
        flex-direction: column;
        gap: 12px;
        padding: 20px;
      }
    }
  </style>
</head>
<body>

<!-- Top Navigation -->
<header>
  <div class="nav-left">
    <a href="/" class="logo">
      <!-- Replace "logo.png" with your actual logo filename -->
      <img src="public/4b81e99c953d4e4f8fb34dd45ff89a4311.png" alt="Irongate Industries" />
    </a>

    <nav class="nav-links">
      <a href="#about">About us <span>&#8964;</span></a>
      <a href="#work">Our Work <span>&#8964;</span></a>
      <a href="#updates">Updates <span>&#8964;</span></a>
      <a href="#software">Software</a>
    </nav>
  </div>

  <div class="nav-right">
    <button class="icon-btn" aria-label="Search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </button>

    <a href="payload-bay.html">
      Payload Bay
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
        <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
        <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>
        <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
      </svg>
    </a>

    <!-- Automatically swaps between "Sign In" and the Clerk User Profile button -->
    <div id="auth-nav-slot">
      <a href="signin/index.html">Sign In</a>
    </div>
  </div>
</header>

<!-- Main Hero Section -->
<main class="hero">
  <div class="hero-content">
    <h1 class="hero-headline">
      Designing simplified, flight-critical hardware built to move from concept to test stand in months—not decades.
    </h1>

    <a href="#about" class="btn-learn-more">
      Learn More
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </a>
  </div>

  <!-- Optional Hero Hardware/Rocket Image (remove this div if your homepage is text-only) -->
  <div class="hero-visual">
    <img src="public/SSC-20211101-s00289~medium.png" alt="Flight-critical aerospace hardware" />
  </div>
</main>

<!-- Footer -->
<footer>
  <span>&copy; 2026 Irongate Industries. All rights reserved.</span>
  <div>
    <a href="terms.html">Terms of Service</a>
    <a href="privacy.html">Privacy Policy</a>
  </div>
</footer>

<!-- Clerk JavaScript SDK (Production Keys for irongateindustries.com) -->
<script
        async
        crossorigin="anonymous"
        data-clerk-publishable-key="pk_live_Y2xlcmsuaXJvbmdhdGVpbmR1c3RyaWVzLmNvbSQ"
        src="https://irongateindustries.com"
        type="text/javascript">
</script>

<script>
  window.addEventListener('load', async function () {
    if (!window.Clerk) return;

    await window.Clerk.load();

    // If the user is signed in, replace "Sign In" in the top right with their profile avatar & Sign Out menu
    if (window.Clerk.user) {
      const navSlot = document.getElementById('auth-nav-slot');
      navSlot.innerHTML = '<div id="user-button"></div>';
      window.Clerk.mountUserButton(document.getElementById('user-button'));
    }
  });
</script>

</body>
</html>
